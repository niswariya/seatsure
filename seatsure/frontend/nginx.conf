# Rendered at container start by the nginx image (envsubst on /etc/nginx/templates).
# BACKEND_URL: http://backend:8080 in docker-compose. On AWS the ALB sends /api and /ws
# straight to the backend, so these two blocks are only a fallback there.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # REST API
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket upgrade for the live seat map
    location /ws {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 1h;
    }

    # Single-page app: unknown paths serve index.html
    location / {
        try_files $uri /index.html;
    }
}
